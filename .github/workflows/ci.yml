name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ยกเลิก run เดิมเมื่อมี push ใหม่เข้ามาที่ branch เดียวกัน
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # ไม่ระบุ version — ใช้ packageManager จาก package.json (pnpm@11.0.8)
        # ถ้าระบุ version ที่นี่จะซ้อนกับ packageManager → action-setup v4 ปฏิเสธ

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests เท่านั้น — integration tests ต้องการ Postgres+Redis จริง (run แยกใน dedicated job ถ้าต้องการ)
      # หมายเหตุ: contrast gate อยู่ใน src/styles/tokens.contrast.test.ts จึงรันไปกับ
      # step นี้อยู่แล้ว ไม่ต้องพึ่ง pretest hook ซึ่งไม่ทำงานเพราะเราเรียก vitest ตรง
      - name: Unit tests
        run: pnpm vitest run --exclude '**/*.integration.test.ts'

      # รันซ้ำเป็น step แยกเพื่อให้เห็นผลชัดใน log ตอน gate ไม่ผ่าน
      # (ตัว gate จริงอยู่ใน unit tests ด้านบนแล้ว)
      #
      # § if: always() จำเป็นจริง — ไม่ใช่ของประดับ
      # ถ้าไม่มี เมื่อ unit tests พังเพราะ contrast ตก job จะหยุดที่ step ก่อนหน้าทันที
      # แล้ว step นี้ซึ่งเป็นตัวเดียวที่พิมพ์ว่าคู่ไหนพัง ค่าเท่าไร ใช้ที่ไหน จะไม่เคย
      # ได้รันในสถานการณ์ที่มันถูกออกแบบมาให้ช่วยพอดี
      - name: Contrast gate
        if: always()
        run: pnpm check-contrast
